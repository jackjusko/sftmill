[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sftmill"
version = "0.1.0"
description = "Mill custom SFT datasets from YAML specs via an OpenAI-compatible teacher"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sftmill = "sftmill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
