[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sftmill"
version = "0.1.0"
description = "Industrial-grade engine for distilling off-policy SFT datasets and multi-turn hybrid-reasoning agent trajectories from OpenAI-compatible teachers."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Jack Jusko" }
]
keywords = [
    "synthetic-data",
    "sft",
    "distillation",
    "hybrid-reasoning",
    "chain-of-thought",
    "agent-trajectories",
    "openai-compatible",
    "tool-use",
    "curriculum-learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/jackjusko/sftmill"
Repository = "https://github.com/jackjusko/sftmill.git"
Documentation = "https://github.com/jackjusko/sftmill#readme"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sftmill = "sftmill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
